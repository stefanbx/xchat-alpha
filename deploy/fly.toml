app = "xchat-alpha-node"
primary_region = "iad"
[build]
[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # The default per-machine concurrency is low, so on a single machine the edge proxy runs out of
  # "candidates" under the app's launch burst and drops requests ("could not find a good candidate") —
  # which is why a phone's release_check failed while the node was healthy. ThreadingHTTPServer handles
  # many concurrent connections cheaply (heavy work is cached/in-process now), so raise the ceiling.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 250
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"   # 512mb OOM'd on restart (ipfs + node + loading the persisted store); 1GB gives headroom

# Persistent disk for the relay store, so restarts/redeploys keep the history.
# One volume ↔ one machine; a second machine would need its own volume and would hold separate
# state (relays are meant to be plural + independent — clients verify every signature anyway).
[mounts]
  source = "xchat_data"
  destination = "/data"
