app = "xchat-alpha-node"
primary_region = "iad"
[build]
[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Persistent disk for the relay store, so restarts/redeploys keep the history.
# One volume ↔ one machine; a second machine would need its own volume and would hold separate
# state (relays are meant to be plural + independent — clients verify every signature anyway).
[mounts]
  source = "xchat_data"
  destination = "/data"
