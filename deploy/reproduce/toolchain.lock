engine_revision   = 5a2a6a42cc
gradle_version    = 9.1.0
agp_version       = 9.0.1
kotlin_version    = 2.3.20
ndk_version       = 28.2.13676358
java_major        = 17

# Container reproduction (deploy/reproduce/Dockerfile) — the canonical amd64 build:
build_platform    = linux/amd64
base_image        = eclipse-temurin:17-jdk-jammy
cmdline_tools     = 11076708
android_platform  = android-36
build_tools       = 36.0.0
canonical_path    = /build/xchat
