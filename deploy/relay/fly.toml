app = "xchat-relay-1"
primary_region = "iad"
[build]
[http_service]
  internal_port = 7401
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
[mounts]
  source = "relay_data"
  destination = "/data"
